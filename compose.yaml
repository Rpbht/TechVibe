services:
  techvibe:
    build:
      context: .
    image: techvibe:latest
    container_name: techvibe
    init: true
    restart: unless-stopped
    ports:
      - "${TECHVIBE_PORT:-5000}:5000"
    environment:
      PORT: "5000"
      DATABASE_PATH: /app/data/techvibe.db
      CONTENT_API_KEY: "${CONTENT_API_KEY:-}"
    volumes:
      - techvibe-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  techvibe-data:
