<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f5" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('techvibe-theme');
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>TechVibe — Engineering Interview &amp; Upskilling Handbook</title>
    <meta name="description" content="Static, distraction-free technical interview preparation handbook covering React, Next.js, TypeScript, Node.js, Python, Golang, Docker, PostgreSQL, and System Design." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
